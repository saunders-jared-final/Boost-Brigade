<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1215 218" font-family="IBM Plex Mono, Menlo, Consolas, monospace" class="qsch"><text x="15.0" y="19.5" font-size="12.8" text-anchor="start" fill="#8a9a92" font-weight="600">SHUFFLER PCB (Version 0) - Qspice baseline: complete model with parasitics</text><text x="15.0" y="43.5" font-size="6.4" text-anchor="start" fill="#8a9a92" font-weight="normal">Three Aiko modules, two two-phase converters (STD45N10F7 + ERUC23-4R1K + TMCS1126), 1ED3140 gate drive with bootstrap, copper / package / capacitor / cable parasitics.</text><text x="15.0" y="54.7" font-size="6.4" text-anchor="start" fill="#8a9a92" font-weight="normal">Open loop: 50 % duty, 200 kHz, 200 ns dead time, legs 180 deg apart. Every parasitic and setting is a .param in the PARAMETERS block at the bottom left - edit values there.</text><text x="15.0" y="66.0" font-size="6.4" text-anchor="start" fill="#8a9a92" font-weight="normal">Node names: PV1P / PV2P / PV3P / GND = string nodes (KiCad PV1+, PV2+, PV3+, GND). T1 / M1 / B1 = converter-1 rails behind the copper lumps, SWA1 / SWB1 = switch nodes,</text><text x="15.0" y="77.2" font-size="6.4" text-anchor="start" fill="#8a9a92" font-weight="normal">gTA1 gBA1 gTB1 gBB1 = gates, BOOTA1 / BOOTB1 = bootstrap nodes, VREG1 = 12 V rail, PWM_AH1 .. = NUCLEO outputs. Same for converter 2 with suffix 2. Generated by PCB_Baseline/gen_shuffler.py --report.</text><text x="22.5" y="201.4" font-size="7.6" text-anchor="start" fill="#8a9a92" font-weight="600">REFERENCE STRING - same modules and load, never gets a converter (comparison only)</text><text x="472.5" y="201.4" font-size="7.6" text-anchor="start" fill="#8a9a92" font-weight="600">PV STRING - 3 x Aiko (Karmalkar-Haneefa model), bypass diode and Cpv per module, 1.5 m cable per lead</text><text x="757.5" y="201.4" font-size="7.6" text-anchor="start" fill="#8a9a92" font-weight="600">BOARD CAPACITORS C1-C4 (130 uF hybrid polymer + ESL)</text><text x="870.0" y="171.4" font-size="7.6" text-anchor="start" fill="#8a9a92" font-weight="600">CONVERTER 1 - rails PV1P (T1) / PV2P (M1 = inductor common node) / PV3P (B1); 12 V gate-drive rail VREG1 referenced to PV3P</text><text x="870.0" y="182.2" font-size="6.4" text-anchor="start" fill="#8a9a92" font-weight="normal">left: 12 V rail, bootstrap, drivers for leg A | middle: leg A, coupled inductor + hall sensor paths, leg B (mirrored) | right: leg B drivers and bootstrap, HF-cap footprints</text><polyline points="90.0,240.0 90.0,285.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="135.0,322.5 135.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="165.0,322.5 165.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="60.0,240.0 90.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="90.0,240.0 135.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="135.0,240.0 165.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="165.0,240.0 195.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="540.0,240.0 510.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1162.5,240.0 1162.5,217.5" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1207.5,240.0 1230.0,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1230.0,240.0 1297.5,240.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1035.0,240.0 1035.0,225.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1005.0,240.0 1005.0,225.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="975.0,240.0 975.0,225.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="90.0" cy="240.0" r="2.2" fill="#4b5b53"/><circle cx="135.0" cy="240.0" r="2.2" fill="#4b5b53"/><circle cx="165.0" cy="240.0" r="2.2" fill="#4b5b53"/><polygon points="547.5,285.0 547.5,240.0 532.5,240.0 532.5,285.0" fill="#eef2f0" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><text x="540.0" y="260.2" font-size="6.4" text-anchor="middle" fill="#3b4a44" font-weight="600">Xcab1p</text><text x="540.0" y="269.2" font-size="6.4" text-anchor="middle" fill="#3b4a44" font-weight="normal">trace</text><polygon points="1162.5,247.5 1207.5,247.5 1207.5,232.5 1162.5,232.5" fill="#eef2f0" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><text x="1185.0" y="237.7" font-size="6.4" text-anchor="middle" fill="#3b4a44" font-weight="600">XtT1</text><text x="1185.0" y="246.7" font-size="6.4" text-anchor="middle" fill="#3b4a44" font-weight="normal">trace</text><polyline points="1042.5,249.0 1027.5,249.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1035.0,240.0 1035.0,249.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1035.0,270.0 1035.0,260.2" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="1035.0,249.0 1042.5,260.2 1027.5,260.2" fill="#3b4a44" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><text x="1044.0" y="246.0" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="600">DbA1</text><text x="1044.0" y="268.5" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="normal">VSSA210</text><polyline points="1005.0,240.0 1005.0,252.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="1005.0,258.0 1005.0,270.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="995.2,258.0 1014.8,258.0 1014.8,257.2 995.2,257.2" fill="#3b4a44" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><polygon points="995.2,252.8 1014.8,252.8 1014.8,252.0 995.2,252.0" fill="#3b4a44" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><text x="1016.2" y="249.7" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="600">CbA1</text><text x="1016.2" y="264.7" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="normal">100n</text><polyline points="975.0,240.0 975.0,252.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="975.0,258.0 975.0,270.0" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polygon points="965.2,258.0 984.8,258.0 984.8,257.2 965.2,257.2" fill="#3b4a44" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><polygon points="965.2,252.8 984.8,252.8 984.8,252.0 965.2,252.0" fill="#3b4a44" stroke="#3b4a44" stroke-width="1.4" stroke-linejoin="round"/><text x="986.2" y="249.7" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="600">Cb2A1</text><text x="986.2" y="264.7" font-size="6.4" text-anchor="start" fill="#3b4a44" font-weight="normal">10u</text><text x="1165.5" y="216.5" font-size="5.7" text-anchor="start" fill="#1f6b46" font-weight="600">PV1P</text></svg>