<text x="1237.2" y="247.3" font-size="18.2" text-anchor="middle" fill="#d00000">VBUS</text>
<text x="34.1" y="57.9" font-size="29.1" text-anchor="start" fill="#0000c8">TEST BENCH for the half-bridge gate driver</text>
<text x="34.1" y="93.7" font-size="18.2" text-anchor="start" fill="#0000c8">Replace V_PWMH and V_PWML with the controller's PWM outputs (3.3 V logic, referenced to GND).</text>
<text x="34.1" y="116.4" font-size="18.2" text-anchor="start" fill="#0000c8">As drawn: 200 kHz, 50 % duty, 200 ns dead time between the two signals.</text>
<text x="34.1" y="139.1" font-size="18.2" text-anchor="start" fill="#0000c8">The block is a hierarchical entry: right click it, Enter Schematic, to see HalfBridge_Driver.qsch.</text>
<text x="34.1" y="161.8" font-size="18.2" text-anchor="start" fill="#0000c8">Copy the block once per half bridge and keep HalfBridge_Driver.qsch in the same folder.</text>
<text x="34.1" y="871.2" font-size="18.2" text-anchor="start" fill="#000000">.tran 20µ</text>
<text x="34.1" y="893.9" font-size="18.2" text-anchor="start" fill="#000000">.plot V(GT,SW) V(GB) V(SW)</text>
