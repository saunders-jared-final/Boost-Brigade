<text x="740.3" y="401.0" font-size="34.9" text-anchor="start" fill="#0000c8">TOP FET DRIVER (1ED3140)</text>
<text x="740.3" y="1407.2" font-size="26.8" text-anchor="start" fill="#0000c8">source stage (OUTH pin)</text>
<text x="740.3" y="1775.9" font-size="26.8" text-anchor="start" fill="#0000c8">sink stage (OUTL pin)</text>
<text x="740.3" y="1339.7" font-size="34.9" text-anchor="start" fill="#0000c8">BOTTOM FET DRIVER (1ED3140)</text>
<text x="53.1" y="85.5" font-size="42.9" text-anchor="start" fill="#0000c8">HALF-BRIDGE GATE DRIVER (hierarchical sheet, one per half bridge)</text>
<text x="53.1" y="138.3" font-size="26.8" text-anchor="start" fill="#0000c8">One 1ED3140 per FET, each drawn as two stages: a source stage (OUTH pin) and a sink stage (OUTL pin).</text>
<text x="53.1" y="171.9" font-size="26.8" text-anchor="start" fill="#0000c8">A stage switches on only while its IN+ is high and its IN- is low.</text>
<text x="53.1" y="205.4" font-size="26.8" text-anchor="start" fill="#0000c8">IN- carries the other FET's PWM: that is the 1ED3140 interlock against cross conduction.</text>
<text x="53.1" y="238.9" font-size="26.8" text-anchor="start" fill="#0000c8">Ports (the six flagged labels): PWM_H and PWM_L are 3.3 V logic from the controller, which sets the dead time.</text>
<text x="53.1" y="272.4" font-size="26.8" text-anchor="start" fill="#0000c8">G_T / S_T go to the top FET gate and source, G_B / S_B to the bottom FET.</text>
<text x="53.1" y="306.0" font-size="26.8" text-anchor="start" fill="#0000c8">V_T and V_B are ideal 12 V supplies floating on the FET source. EN pins are tied to the supply.</text>
</svg>