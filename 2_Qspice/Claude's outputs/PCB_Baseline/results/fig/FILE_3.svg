<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 966 452" font-family="IBM Plex Mono, Menlo, Consolas, monospace" class="qsch"><text x="21.0" y="30.6" font-size="12.5" text-anchor="start" fill="#8a9a92" font-weight="600">PARAMETERS - edit values here (units: m = milli, u = micro, n = nano, p = pico)</text><text x="21.0" y="55.6" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">* Switching and gate drive</text><text x="21.0" y="71.4" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Tsw=5u</text><text x="294.0" y="71.4" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">switching period (5 us = 200 kHz)</text><text x="21.0" y="87.1" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Tdead=200n</text><text x="294.0" y="87.1" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">dead time between the two FETs of a leg</text><text x="21.0" y="102.9" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Vlogic=3.3</text><text x="294.0" y="102.9" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">PWM logic level (NUCLEO)</text><text x="21.0" y="118.6" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Vreg=12</text><text x="294.0" y="118.6" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">gate-drive rail from the Wurth 173951275 module (ideal source)</text><text x="21.0" y="134.4" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Ron=10</text><text x="294.0" y="134.4" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">driver OUTH (source) path resistor, KOA SG73S 10R</text><text x="21.0" y="150.1" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Roff=4.7</text><text x="294.0" y="150.1" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">driver OUTL (sink) path resistor, KOA SG73P 4R7</text><text x="21.0" y="165.9" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Rboot=10</text><text x="294.0" y="165.9" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">bootstrap series resistor</text><text x="21.0" y="190.0" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">* Bench loads and irradiance case</text><text x="21.0" y="205.8" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Rmpp=8.148</text><text x="294.0" y="205.8" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">resistor load near the 3-module MPP at 1000 W/m2 (ohm)</text><text x="21.0" y="221.5" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Icc=10</text><text x="294.0" y="221.5" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">constant-current bench load (A), ramped up over the first 200 us; keep below ~11 A with one converter</text><text x="21.0" y="237.3" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param CASE=1</text><text x="294.0" y="237.3" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">irradiance pattern 1..3 (stepped by the .step line)</text><text x="21.0" y="253.0" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param LOADSEL=0</text><text x="294.0" y="253.0" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">0 = resistor load, 1 = current sink (stepped)</text><text x="21.0" y="277.2" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">* Module and cable</text><text x="21.0" y="292.9" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Cpv=10n</text><text x="294.0" y="292.9" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">PV module terminal capacitance (ballpark)</text><text x="21.0" y="308.7" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Rcab=6.95m</text><text x="294.0" y="308.7" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">module cable, one lead: 1.5 m of 4 mm2 + XT60 contact</text><text x="21.0" y="324.4" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Lcab=750n</text><text x="294.0" y="324.4" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">module cable, one lead (about 1 uH/m loop)</text><text x="21.0" y="348.6" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">* Board capacitors, package, sensor</text><text x="21.0" y="364.3" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param ESR130=28m</text><text x="294.0" y="364.3" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">TDK B40910A0137M000 130 uF: ESR</text><text x="21.0" y="380.1" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param ESL130=15n</text><text x="294.0" y="380.1" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">130 uF radial can: ESL</text><text x="21.0" y="395.8" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Ld_pkg=1.5n</text><text x="294.0" y="395.8" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">TO-252 drain tab inductance</text><text x="21.0" y="411.6" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Ls_pkg=3n</text><text x="294.0" y="411.6" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">TO-252 source lead inductance (common-source)</text><text x="21.0" y="427.3" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Rtmcs=0.7m</text><text x="294.0" y="427.3" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">TMCS1126 conductor resistance</text><text x="21.0" y="443.1" font-size="8.9" text-anchor="start" fill="#1b2d55" font-weight="normal">.param Ltmcs=0.5n</text><text x="294.0" y="443.1" font-size="8.9" text-anchor="start" fill="#8a9a92" font-weight="normal">TMCS1126 conductor inductance</text><polyline points="756.0,-10.5 756.0,10.5" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="819.0,-10.5 819.0,10.5" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="882.0,-10.5 882.0,10.5" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="756.0,-17.8 756.0,-10.5" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="756.0,-52.5 756.0,-45.1" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="756.0" cy="-31.5" rx="13.7" ry="13.7" fill="none" stroke="#3b4a44" stroke-width="1.4"/><polyline points="749.7,-27.3 753.9,-35.7" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="753.9,-35.7 758.1,-27.3" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="758.1,-27.3 762.3,-35.7" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><text x="766.5" y="-44.1" font-size="8.9" text-anchor="start" fill="#3b4a44" font-weight="600">BE1</text><text x="766.5" y="-12.6" font-size="8.9" text-anchor="start" fill="#3b4a44" font-weight="normal">V(…)</text><polyline points="819.0,-17.8 819.0,-10.5" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><polyline points="819.0,-52.5 819.0,-45.1" fill="none" stroke="#3b4a44" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="819.0" cy="-31.5" rx="13.7" ry="13.7" fill="none" stroke="#3b4a44" stroke-width="1.4"/><polyline points="812.7,