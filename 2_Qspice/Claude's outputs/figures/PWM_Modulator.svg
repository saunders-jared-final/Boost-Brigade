<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2044 980" font-family="IBM Plex Mono, Menlo, Consolas, monospace" class="qsch"><text x="84.0" y="89.8" font-size="16.7" text-anchor="start" fill="#8a9a92" font-weight="600">PWM MODULATOR - HRTIM-style comparators of one converter</text><text x="84.0" y="144.2" font-size="11.9" text-anchor="start" fill="#8a9a92" font-weight="normal">Top FET on while RAMP &lt; D - Tdead/Tsw, bottom FET on while D &lt; RAMP &lt; 1 - Tdead/Tsw: Tdead is cut from both edges of every pulse.</text><text x="84.0" y="172.2" font-size="11.9" text-anchor="start" fill="#8a9a92" font-weight="normal">RAMPA / RAMPB are the 0..1 sawtooth ramps of leg A and leg B (leg B half a period later), DA / DB the commanded duties of the legs.</text><text x="84.0" y="200.2" font-size="11.9" text-anchor="start" fill="#8a9a92" font-weight="normal">All outputs are low for t &lt; 1 ns so the operating point is found with the FETs off (pwm_top / pwm_bot are .func on the top sheet).</text><polyline points="84.0,336.0 168.0,336.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="84.0,448.0 168.0,448.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="84.0,560.0 168.0,560.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="84.0,672.0 168.0,672.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="504.0,364.0 504.0,392.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="504.0,308.0 504.0,280.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="504.0,280.0 924.0,280.0" fill="none" stroke="#4b5b53" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><polyline points="504.0,5