# Shuffler run-time parameters: the source of truth on the Pi.
# Edit here or on the web page (http://<pi>:8080, params_web.py); "Push" sends every value with C,SET / C,SETM,
# "Apply" swaps the staged gain set in at a control-tick boundary (bumpless). "Save" writes the Nucleo's values
# back into this file. Bounds and classes are enforced by the firmware (C,LIST shows them):
#   LIVE   takes effect immediately       IDLE   refused while switching       STAGED  needs Apply
# Format: one "name: value   # comment" per line; M is a 4x4 block. Keep it that simple (no PyYAML on the Pi).

# ---- controller gain set (STAGED: Push, then Apply) ----
kscale: 0.3            # 0.05..1   scales the whole PI (bandwidth). Boot default 0.3; raise in steps on the bench
kp_v: 0.000158         # 0..0.01 s P/I ratio, voltage channels (VM1-VM2, VM2-VM3)
kp_i: 0.000108         # 0..0.01 s P/I ratio, circulating-current channels (ILA+ILB)
fc_lpf: 2000           # 100..4000 Hz measurement LPF corner (controller side)
dmin: 0.08             # 0.05..0.45 duty clamp low (200 kHz: 0.05 = 250 ns on-time vs 200 ns dead time)
dmax: 0.92             # 0.55..0.95 duty clamp high
# M = inv(G)*diag(kI), rows/cols: [VM1-VM2, VM2-VM3, ic1, ic2]. Simulink carpark model, BENCH ident
# (sps-params-2.20261015-1754-3mod-simulink-bench) = params.h. Current channels ~3x softer than QSPICE (safer start).
# QSPICE S9i alternative (switching model, faster current loop), copy over the rows below to try it:
#   - [-25.2252, -0.538334, 1.94722, 0.248092]
#   - [-0.2732, -24.9973, -0.470587, -2.09162]
#   - [0.0689137, -0.0175995, 9.99926, 1.1799]
#   - [-0.0300471, 0.101213, 1.86678, 11.8738]
M:
  - [-20.4772, 0.0097938, -0.0457161, 0.0914978]
  - [-0.00834409, -19.9026, -0.0889698, 0.0445129]
  - [0, 0, 3.38957, 0]
  - [0, 0, 0, 3.38501]

# ---- supervisor (LIVE) ----
sup_en: 1              # 0/1 feasibility governor on
sup_i_rated: 10        # 1..12 A shuffled-current rating used for stress
sup_s_hi: 0.9          # 0.3..1 governor engage threshold
sup_s_lo: 0.7          # 0.1..0.95 governor release threshold
vref1: 0               # -30..30 V manual offset on VM1-VM2 (closed loop)
vref2: 0               # -30..30 V manual offset on VM2-VM3

# ---- sensing (hall gains LIVE, zeros IDLE) ----
hall_mva0: 100         # ILA_1 mV/A (sign = sensor orientation, |x| >= 10)
hall_mva1: 25          # ILB_1 mV/A  CHECK: BOM says TMCS1126B4 (100 mV/A) everywhere; bench DC test decides
hall_mva2: 100         # ILA_2 mV/A
hall_mva3: 25          # ILB_2 mV/A  CHECK as hall_mva1
hall_zero0: 2048       # 1800..2300 ADC zero code (boot zero-cal overrides; set only after a bench check)
hall_zero1: 2048
hall_zero2: 2048
hall_zero3: 2048

# ---- VM1 source (IDLE) ----
vm1_src: 0             # 0 = U10 (INA CS3), 1 = vstr_param - VM2 - VM3 (DL3021 in CV), 2 = DL3021 readback via eload.py
vstr_param: 70         # 0..150 V string voltage for vm1_src = 1: the DL3021 CV setpoint (LIVE)

# ---- protection (LIVE) ----
oc_a: 12               # 0.5..12 A over-current latch (tick average, 2 ms)
vm_ov: 30              # 5..32 V per-module over-voltage
vm_uv: 3               # 0..20 V per-module under-voltage (closed loop)
vstr_ov: 85            # 10..96 V string over-voltage (3 x KAUSSP80 Voc = 75.2 V)
slew: 0.01             # 0.0005..0.2 closed-loop duty slew limit per 100 us tick
wdg_s: 5               # 0..60 s closed loop stops without a command / heartbeat (0 = off; the pod pings at 1 Hz)
