apiVersion: 1
datasources:
  - name: InfluxDB
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: boost
      defaultBucket: shuffler
    secureJsonData:
      token: $INFLUX_TOKEN   # expanded by Grafana from the container environment (docker-compose.yml)
